[project]
name = "reviewerfinder"
version = "0.1.0"
description = "Find qualified peer-review candidate scholars for a given paper"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "pyyaml>=6.0",
    "rapidfuzz>=3.9",
    "pypdf>=4.0",
]

[project.optional-dependencies]
chatbot = [
    "langchain>=1.0",
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=1.0",
    "langchain-ollama>=0.2",
]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
]

[project.scripts]
reviewerfinder = "reviewerfinder.cli:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
